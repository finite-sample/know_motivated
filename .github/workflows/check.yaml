name: Replication checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          r-version: '4.6.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2.14.0
      - name: Install table rendering tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-latex-recommended texlive-latex-extra lmodern
      - run: make check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: replication-results
          path: |
            tabs/
            figs/
            paper/main.pdf
            data/build/session_info.txt
